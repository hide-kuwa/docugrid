# OCR / 検索精度ラボ — ノーコード試行プリセット
# 事務所上書きは UI または storage/firms/{firm}/accuracy_lab_presets.json

version: 1

trial_keywords:
  - 源泉徴収
  - 法人税申告書
  - 消費税
  - 給与所得
  - 源泉徴収票
  - 総勘定元帳
  - 決算報告書
  - 固定資産
  - 役員報酬
  - インボイス

check_prompts:
  - id: search_hit
    label: 期待する資料が検索に出るか
  - id: excerpt_quality
    label: 抜粋に判断材料があるか
  - id: ocr_ready
    label: OCR が ready になるか
  - id: false_positive
    label: 無関係ヒットが多すぎないか

outcome_labels:
  ok: 意図どおり
  partial: 部分的に可
  fail: ダメ
  unknown: 未判定
